# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: datomic
  uri: <%= ENV.fetch("DATOMIC_URI", "datomic:dev://localhost:4334/wallet") %>
  client_endpoint: <%= ENV.fetch("DATOMIC_CLIENT_ENDPOINT", "localhost:8998") %>
  access_key: <%= ENV.fetch("DATOMIC_ACCESS_KEY", "chronicle-dev") %>
  secret: <%= ENV.fetch("DATOMIC_SECRET", "chronicle-dev-secret") %>

development:
  primary:
    <<: *default
  datomic:
    <<: *default

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
  datomic:
    <<: *default

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
  datomic:
    <<: *default
