services:
  datomic:
    build:
      context: .
      dockerfile: Dockerfile.datomic
      args:
        DATOMIC_VERSION: ${DATOMIC_VERSION:-1.0.7705}
    restart: unless-stopped
    environment:
      DATOMIC_ACCESS_KEY: ${DATOMIC_ACCESS_KEY:-chronicle-dev}
      DATOMIC_SECRET: ${DATOMIC_SECRET:-chronicle-dev-secret}
    volumes:
      - datomic-data:/var/lib/datomic
      - datomic-install:/opt/datomic
    ports:
      - "4334:4334"
      - "4335:4335"
      - "8998:8998"
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8998/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - /bin/sh
      - -ec
      - |
        /opt/datomic/bin/transactor /opt/datomic/config/transactor.properties &
        until nc -z 127.0.0.1 4334; do sleep 2; done
        /opt/datomic/bin/run -m datomic.peer-server \
          -h 0.0.0.0 \
          -p 8998 \
          -a "$${DATOMIC_ACCESS_KEY},$${DATOMIC_SECRET}" \
          -d wallet,datomic:dev://localhost:4334/wallet \
          -d news-feed,datomic:dev://localhost:4334/news-feed \
          -d animal-tracker,datomic:dev://localhost:4334/animal-tracker &
        /opt/datomic/bin/rest -p 8001 dev datomic:dev://localhost:4334/ &
        wait

  wallet:
    build:
      context: ..
      dockerfile: examples/Dockerfile.wallet
    depends_on:
      datomic:
        condition: service_healthy
    environment:
      DATOMIC_HOME: /opt/datomic
      DATOMIC_URI: datomic:dev://datomic:4334/wallet
      DATOMIC_CLIENT_ENDPOINT: datomic:8998
      DATOMIC_ACCESS_KEY: ${DATOMIC_ACCESS_KEY:-chronicle-dev}
      DATOMIC_SECRET: ${DATOMIC_SECRET:-chronicle-dev-secret}
    volumes:
      - datomic-install:/opt/datomic:ro
    ports:
      - "3000:3000"
    command: bundle exec rails server -b 0.0.0.0

  news_feed:
    build:
      context: ..
      dockerfile: examples/Dockerfile.news_feed
    depends_on:
      datomic:
        condition: service_healthy
    environment:
      DATOMIC_URI: datomic:dev://datomic:4334/news-feed
      DATOMIC_CLIENT_ENDPOINT: https://datomic:8001
    ports:
      - "3001:3000"
    command: bundle exec rails server -b 0.0.0.0

  animal_tracker:
    build:
      context: ..
      dockerfile: examples/Dockerfile.animal_tracker
    depends_on:
      datomic:
        condition: service_healthy
    environment:
      DATOMIC_URI: datomic:dev://datomic:4334/animal-tracker
      DATOMIC_TRANSPORT: peer
      DATOMIC_HOME: /opt/datomic
    volumes:
      - datomic-install:/opt/datomic:ro
    ports:
      - "3002:3000"
    command: bundle exec rails server -b 0.0.0.0

volumes:
  datomic-data:
  datomic-install:
