services:
  datomic:
    build:
      context: .
      dockerfile: Dockerfile.datomic
      args:
        DATOMIC_VERSION: ${DATOMIC_VERSION:-1.0.7705}
    restart: unless-stopped
    volumes:
      - datomic-data:/var/lib/datomic
      - datomic-install:/opt/datomic
    ports:
      - "4334:4334"
      - "4335:4335"
    command:
      - /bin/sh
      - -ec
      - |
        cp /opt/chronicle/transactor.properties /opt/datomic/config/transactor.properties
        grep -q '^memory-index-max=' /opt/datomic/config/transactor.properties
        exec /opt/datomic/bin/transactor /opt/datomic/config/transactor.properties
    healthcheck:
      test: ["CMD-SHELL", "nc -z datomic 4334"]
      interval: 5s
      timeout: 3s
      retries: 30

  datomic_rest:
    build:
      context: .
      dockerfile: Dockerfile.datomic
      args:
        DATOMIC_VERSION: ${DATOMIC_VERSION:-1.0.7705}
    depends_on:
      datomic:
        condition: service_healthy
    environment:
      DATOMIC_STORAGE_PASSWORD: ${DATOMIC_STORAGE_PASSWORD:-chronicle-datomic}
    volumes:
      - datomic-install:/opt/datomic:ro
      - datomic-rest-log:/opt/datomic/log
    ports:
      - "8001:8001"
    command:
      - /bin/sh
      - -ec
      - exec /opt/datomic/bin/rest -p 8001 dev "datomic:dev://datomic:4334/?password=$${DATOMIC_STORAGE_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/data/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  datomic-peer:
    build:
      context: .
      dockerfile: Dockerfile.datomic
      args:
        DATOMIC_VERSION: ${DATOMIC_VERSION:-1.0.7705}
    depends_on:
      datomic_rest:
        condition: service_healthy
    environment:
      DATOMIC_ACCESS_KEY: ${DATOMIC_ACCESS_KEY:-chronicle-dev}
      DATOMIC_SECRET: ${DATOMIC_SECRET:-chronicle-dev-secret}
      DATOMIC_STORAGE_PASSWORD: ${DATOMIC_STORAGE_PASSWORD:-chronicle-datomic}
    volumes:
      - datomic-install:/opt/datomic:ro
      - datomic-peer-log:/opt/datomic/log
    ports:
      - "8998:8998"
    command:
      - /bin/sh
      - -ec
      - |
        for database in wallet news-feed animal-tracker cross-store; do
          curl -fsS -X POST -H 'Content-Type: application/edn' \
            http://datomic_rest:8001/data/dev/ \
            --data "{:db-name \"$${database}\"}" >/dev/null || true
        done
        exec /opt/datomic/bin/run -m datomic.peer-server \
          -h 0.0.0.0 \
          -p 8998 \
          -a "$${DATOMIC_ACCESS_KEY},$${DATOMIC_SECRET}" \
          -d "wallet,datomic:dev://datomic:4334/wallet?password=$${DATOMIC_STORAGE_PASSWORD}" \
          -d "news-feed,datomic:dev://datomic:4334/news-feed?password=$${DATOMIC_STORAGE_PASSWORD}" \
          -d "animal-tracker,datomic:dev://datomic:4334/animal-tracker?password=$${DATOMIC_STORAGE_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "ps -eo args | grep -q '[d]atomic.peer-server'"]
      interval: 5s
      timeout: 3s
      retries: 30

  wallet:
    build:
      context: ..
      dockerfile: examples/Dockerfile.wallet
    depends_on:
      datomic-peer:
        condition: service_healthy
    environment:
      DATOMIC_HOME: /opt/datomic
      DATOMIC_URI: datomic:dev://datomic:4334/wallet
      DATOMIC_CLIENT_ENDPOINT: datomic-peer:8998
      DATOMIC_ACCESS_KEY: ${DATOMIC_ACCESS_KEY:-chronicle-dev}
      DATOMIC_SECRET: ${DATOMIC_SECRET:-chronicle-dev-secret}
    volumes:
      - datomic-install:/opt/datomic:ro
    ports:
      - "3000:3000"
    command: bundle exec bin/rails server -b 0.0.0.0

  news_feed:
    build:
      context: ..
      dockerfile: examples/Dockerfile.news_feed
    depends_on:
      datomic_rest:
        condition: service_healthy
    environment:
      DATOMIC_URI: datomic:dev://datomic:4334/news-feed
      DATOMIC_CLIENT_ENDPOINT: http://datomic_rest:8001
      DISABLE_SPRING: "1"
    ports:
      - "3001:3000"
    command: sh -ec 'bundle exec bin/rails db:migrate:primary && exec bundle exec bin/rails server -b 0.0.0.0'

  cross_store:
    build:
      context: ..
      dockerfile: examples/Dockerfile.cross_store
    depends_on:
      datomic_rest:
        condition: service_healthy
    environment:
      DATOMIC_URI: datomic:dev://datomic:4334/cross-store
      DATOMIC_CLIENT_ENDPOINT: http://datomic_rest:8001
    ports:
      - "3003:3000"
    command: sh -ec 'cd /app/examples/cross_store && bundle exec bin/rails db:migrate:primary && bundle exec bin/rails runner "load Rails.root.join(\"db/seeds.rb\")" && exec bundle exec bin/rails server -b 0.0.0.0'

  animal_tracker:
    build:
      context: ..
      dockerfile: examples/Dockerfile.animal_tracker
    depends_on:
      datomic:
        condition: service_healthy
    environment:
      DATOMIC_URI: datomic:dev://datomic:4334/animal-tracker
      DATOMIC_CLIENT_ENDPOINT: datomic-peer:8998
      DATOMIC_ACCESS_KEY: ${DATOMIC_ACCESS_KEY:-chronicle-dev}
      DATOMIC_SECRET: ${DATOMIC_SECRET:-chronicle-dev-secret}
      DATOMIC_HOME: /opt/datomic
    volumes:
      - datomic-install:/opt/datomic:ro
    ports:
      - "3002:3000"
    command: bundle exec bin/rails server -b 0.0.0.0

volumes:
  datomic-data:
  datomic-install:
  datomic-rest-log:
  datomic-peer-log:
